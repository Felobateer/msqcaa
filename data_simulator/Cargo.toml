[package]
name = "data_simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
env_logger = "0.11.10"
log = "0.4.31"
ndarray = "0.17.2"
polars = { version = "0.54.3", features = ["lazy", "temporal", "strings"] }
rdkafka = { version = "0.39.0", features = ["tokio", "cmake-build"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "json"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-postgres = { version = "^0.7.17", features = ["with-serde_json-1"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }