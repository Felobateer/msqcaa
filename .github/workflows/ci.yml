name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Rust Linting
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust Formatting
        run: cargo fmt --manifest-path ./data_simulator/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path ./data_simulator/Cargo.toml -- -D warnings

      # Python Linting
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'ml/.python-version'
      - name: Lint Python
        working-directory: ./ml
        run: uv run ruff check . || echo "Replace with your python linter (e.g., flake8/ruff)"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      # Rust Testing
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust
        run: cargo test --manifest-path ./data_simulator/Cargo.toml

      # Python Testing
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'ml/.python-version'
      - name: Test Python
        working-directory: ./ml
        run: uv sync && uv run pytest || echo "Replace with your python test command"

  build:
    name: Build Docker Compose
    # Only run build on actual merges/pushes to the branch, not PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Images
        run: docker compose build

  deploy:
    name: Deploy Application
    # Only deploy if the build succeeds on a push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Insert your deployment script or SSH actions here"