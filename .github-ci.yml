name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-rust-simulator:
    name: Test Rust Data Simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./data_simulator
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Formatting
        run: cargo fmt -- --check
      - name: Run Tests
        run: cargo test
  test-python-ml:
    name: Test Python ML App
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: ./ml
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'ml/.python-version'
      - name: Install Dependencies
        run: uv sync
      - name: Run Tests (pytest)
        run: uv run pytest || echo "Add pytest to your project or replace with your test command"

  docker-build:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    needs: [test-rust-simulator, test-python-ml]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Images
        run: docker compose build